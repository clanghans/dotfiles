# Static lock-screen colors + wallpaper (fixed, no theme-switcher).
# Drop your own wallpaper at ~/.config/hypr/theme/wallpaper.jpg (or edit the
# path below) and tweak the colors to taste.

$color = rgba(1e1e2eff)
$inner_color = rgba(313244cc)
$outer_color = rgba(89b4faff)
$font_color = rgba(cdd6f4ff)
$check_color = rgba(a6e3a1ff)
$wallpaper = ~/.config/hypr/theme/wallpaper.jpg
