onboarding = false
# herdr configuration - migrated from tmux

[theme]
# Dracula theme to match your previous tmux setup
name = "dracula"
auto_switch = true
dark_name = "dracula"
light_name = "dracula"

[terminal]
# New panes inherit CWD from the source pane (like tmux default)
new_cwd = "follow"

[keys]
# Use default ctrl+b prefix
prefix = "ctrl+b"

# Workspace management (replaces your tmux-fzf/frost session handling)
workspace_picker = "prefix+w"       # Open workspace picker
new_workspace = "prefix+shift+n"    # Create new workspace
rename_workspace = "prefix+shift+w" # Rename workspace
close_workspace = "prefix+shift+d"  # Close workspace

# Tab management (replaces your tmux window bindings)
new_tab = "prefix+c"
next_tab = ["prefix+n", "prefix+ctrl+n"]
previous_tab = ["prefix+p", "prefix+ctrl+p"]
close_tab = "prefix+x"

# Pane navigation (herdr's equivalents to your vim-tmux-navigator)
focus_pane_left = "ctrl+h"
focus_pane_down = "ctrl+j"
focus_pane_up = "ctrl+k"
focus_pane_right = "ctrl+l"
split_vertical = "prefix+\\"
split_horizontal = "prefix+minus"
close_pane = "prefix+q"
zoom = "prefix+z"

# Additional useful bindings
cycle_pane_next = "prefix+tab"
cycle_pane_previous = "prefix+shift+tab"
edit_scrollback = "prefix+e"             # Like copy mode
toggle_sidebar = "prefix+b"
reload_config = "prefix+shift+r"

# Workspace navigation (recent navigator plugin)
[[keys.command]]
key = "prefix+ctrl+space"
type = "plugin_action"
command = "beyondlex.herdr-recent-navigator.focus-workspaces"
description = "Recent workspaces popup"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "third774.last-workspace.toggle"
description = "Recent workspace"

[[keys.command]]
key = "prefix+ctrl+y"
type = "popup"
command = "herdr-snaglord"
width = "60%"
height = "60%"

[ui]
# Visual preferences
pane_borders = true
prompt_new_workspace_name = true
prompt_new_tab_name = false
hide_tab_bar_when_single_tab = false
pane_gaps = true
mouse_capture = true
copy_on_select = true

# Sidebar behavior
sidebar_width = 26
agent_panel_sort = "spaces"

# Notifications
[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-right"

# Session restoration for AI agents
[session]
resume_agents_on_restore = true

# Remote SSH
[remote]
manage_ssh_config = true

[experimental]
allow_nested = false
