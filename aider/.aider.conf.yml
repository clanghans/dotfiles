# Aider configuration aligned with CLAUDE.md conventions

## Language & Style
# All English: code, comments, documentation, commits, configs, errors, tests
# (enforced via system prompt in model-settings.yml)

## Model Settings
# Load system prompt from model-settings.yml
model-settings-file: aider/model-settings.yml

## Model
# Use Claude 3.5 Sonnet (or your preferred model)
model: claude-3-5-sonnet-20241022

## Edit Format
# Use structured edit format for precise diffs
edit-format: diff

## Git
# Auto-commit changes with conventional commit messages
auto-commits: true
# Dirty commits allowed (commit even if repo has uncommitted changes)
dirty-commits: true
# Attribute commits to the human developer (no AI attribution)
attribute-author: true
# Attribute committer as well
attribute-committer: true

## Advanced Options
# Enable map-tokens for large repo context
map-tokens: 1024
# Cache prompts to reduce API calls
cache-prompts: true
# Watch files for external changes
watch-files: true
# Use tree-sitter for better code understanding
tree-sitter: true
# Enable linting of changed files
lint: true
# Test command to run after changes (adjust to your project)
# test-cmd: "pytest"

## Git Commit Convention
# Format: <type>(<scope>): <subject>
# Types: feat, fix, docs, style, refactor, test, chore, perf
# Subject: max 50 chars, imperative mood, no period
# Complex changes: add body (72-char lines) explaining what/why
# Keep commits atomic and self-explanatory
# (Aider doesn't enforce commit message format; these are guidelines for the developer)

## Git Commit Authorship
# Never mention Claude or any AI in commits
# Commits must appear as authored solely by the human developer
# (Aider already uses the user's git config for authorship)

## Tool Preferences
# Search: rg instead of grep
# Find: fd instead of find
# Visualization: tree
# (These are user-side preferences; aider doesn't invoke them directly)

## Tone & Behavior
# Welcome critical feedback, be skeptical, no flattery
# Ask questions if intent is unclear
# No sycophantic openers, no filler transitions
# Active voice, no banned words (delve, crucial, leverage, etc.)
# Match length to complexity, no conclusion paragraphs
# (These are communicated via the system prompt in model-settings.yml)

## Azure DevOps Integration
# Environment variables required:
#   AZURE_DEVOPS_EXT_USER=<your_username>
#   AZURE_DEVOPS_EXT_PAT=<your_personal_access_token>
# Organization: REDACTED-ORG-1
# Project: REDACTED-PROJECT
# Base API URL: https://dev.azure.com/REDACTED-ORG-1/REDACTED-PROJECT/_apis/
# (These are documented in the system prompt for the model)

## RTK Guidelines
# Refer to @RTK.md for RTK-specific guidelines when working with RTK-related code.
# (Aider doesn't support file includes; the system prompt mentions this reference)
